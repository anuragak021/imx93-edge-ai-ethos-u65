<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>i.MX 93 Edge AI Demo</title>
<style>
  :root {
    --bg: #0b0f17; --panel: #121826; --line: #232c40; --text: #e6ebf5; --dim: #8592ab;
    --cpu: #f0b429; --npu: #3ddc97; --accent: #6aa7ff;
    --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, "DejaVu Sans Mono", monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.4 system-ui, "Segoe UI", sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; padding: 14px 24px; border-bottom: 1px solid var(--line); }
  h1 { font-size: 20px; margin: 0; letter-spacing: .2px; }
  h1 span { color: var(--dim); font-weight: 400; font-size: 14px; margin-left: 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; flex: 1; }
  .chip { background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px; font-size: 12.5px; color: var(--dim); }
  .chip b { color: var(--text); font-weight: 600; }
  button { background: var(--accent); color: #07101f; border: 0; border-radius: 8px; padding: 9px 22px; font-size: 15px; font-weight: 700; cursor: pointer; }
  button:disabled { opacity: .45; cursor: default; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(320px, 440px); gap: 16px; padding: 16px 24px 24px; }
  @media (max-width: 1050px) { main { grid-template-columns: 1fr; } }
  .drop { grid-column: 1 / -1; border: 2px dashed var(--line); border-radius: 12px; padding: 16px 20px; background: var(--panel); transition: border-color .2s, background .2s; }
  .drop.over { border-color: var(--accent); background: #16213a; }
  .drop .msg { display: flex; align-items: center; gap: 14px; cursor: pointer; }
  .drop .msg svg { flex: none; }
  .drop .msg b { display: block; font-size: 16px; }
  .drop .msg span { color: var(--dim); font-size: 13px; }
  .tray { display: flex; gap: 10px; overflow-x: auto; padding-top: 12px; }
  .tray:empty { display: none; }
  .up { flex: none; width: 96px; }
  .up .th { position: relative; width: 96px; height: 72px; border-radius: 6px; overflow: hidden; background: #0d1320; }
  .up img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .up .pg { position: absolute; left: 0; bottom: 0; height: 4px; width: 0; background: var(--accent); }
  .up.ok .pg { background: var(--npu); }
  .up.ok .th::after { content: "\2713"; position: absolute; top: 3px; right: 5px; color: var(--npu); font-weight: 700; text-shadow: 0 0 4px #000; }
  .up .nm { font-size: 11px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 3px; }
  .upstat { margin-top: 8px; font-size: 13px; color: var(--dim); }
  .upstat:empty { display: none; }
  .lanes { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 700px) { .lanes { grid-template-columns: 1fr; } }
  .lane { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; min-height: 200px; }
  .lane.cpu { --c: var(--cpu); } .lane.npu { --c: var(--npu); }
  .lane.active { border-color: var(--c); box-shadow: 0 0 0 1px var(--c) inset; }
  .lane h2 { font-size: 15px; margin: 0 0 2px; color: var(--c); }
  .lane .sub { color: var(--dim); font-size: 12.5px; margin-bottom: 8px; }
  .big { font-family: var(--mono); font-size: 44px; font-weight: 700; color: var(--c); line-height: 1.1; }
  .big small { font-size: 18px; color: var(--dim); font-weight: 400; margin-left: 4px; }
  .count { color: var(--dim); font-size: 12.5px; margin-bottom: 10px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 8px; max-height: 62vh; overflow-y: auto; padding-right: 2px; }
  .card { background: #0d1320; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .card.new { border-color: var(--c); animation: pop .35s ease-out; }
  @keyframes pop { from { transform: scale(.92); opacity: 0; } to { transform: none; opacity: 1; } }
  .card img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; }
  .card .cap { padding: 4px 6px 5px; font-size: 12px; line-height: 1.25; }
  .card .cap .l { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .cap .t { font-family: var(--mono); color: var(--c); }
  .side { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  .panel h3 { margin: 0 0 10px; font-size: 13px; color: var(--dim); font-weight: 600; text-transform: uppercase; letter-spacing: .6px; }
  .bar { display: flex; align-items: center; gap: 10px; margin: 6px 0; font-size: 13px; }
  .bar .name { width: 40px; color: var(--dim); }
  .bar .track { flex: 1; background: #0d1320; border-radius: 6px; height: 22px; overflow: hidden; }
  .bar .fill { height: 100%; width: 0; transition: width .4s; }
  .bar .val { width: 84px; text-align: right; font-family: var(--mono); }
  .verdict { font-size: 26px; font-weight: 700; color: var(--npu); margin-top: 8px; }
  .verdict small { display: block; font-size: 13px; color: var(--dim); font-weight: 400; }
  .term { background: #05080d; border: 1px solid var(--line); border-radius: 12px; display: flex; flex-direction: column; min-height: 320px; flex: 1; }
  .term .bar-top { padding: 8px 12px; border-bottom: 1px solid var(--line); color: var(--dim); font-size: 12.5px; font-family: var(--mono); }
  .term pre { margin: 0; padding: 10px 12px; overflow: auto; height: 52vh; font: 12.5px/1.45 var(--mono); white-space: pre-wrap; word-break: break-all; }
  .cmd { color: var(--accent); } .dim { color: var(--dim); } .err { color: #ff6b6b; }
  .res-cpu { color: var(--cpu); } .res-npu { color: var(--npu); }
  #status { color: var(--dim); font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1>i.MX 93 Edge AI <span>MobileNetV2 int8: Cortex-A55 vs Ethos-U65 NPU</span></h1>
  <div class="chips" id="chips"></div>
  <span id="status"></span>
  <button id="start">Start</button>
</header>
<main>
  <section class="drop" id="drop">
    <label class="msg" for="picker">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#6aa7ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4m0 0l-4 4m4-4l4 4"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
      <div><b>Drop images here to send them to the board</b><span>or click to choose files. Several at a time, JPEG or PNG. The board classifies the files you drop.</span></div>
    </label>
    <input id="picker" type="file" accept="image/*" multiple hidden>
    <div class="tray" id="tray"></div>
    <div class="upstat" id="upstat"></div>
  </section>
  <section class="lanes">
    <div class="lane cpu" id="lane-cpu">
      <h2>Cortex-A55 CPU</h2><div class="sub">2 threads, XNNPACK</div>
      <div class="big"><span id="ms-cpu">--</span><small>ms</small></div>
      <div class="count" id="count-cpu">waiting</div>
      <div class="grid" id="grid-cpu"></div>
    </div>
    <div class="lane npu" id="lane-npu">
      <h2>Ethos-U65 NPU</h2><div class="sub">Vela-compiled model, Ethos-U delegate</div>
      <div class="big"><span id="ms-npu">--</span><small>ms</small></div>
      <div class="count" id="count-npu">waiting</div>
      <div class="grid" id="grid-npu"></div>
    </div>
  </section>
  <aside class="side">
    <div class="panel">
      <h3>Median latency per image (invoke only)</h3>
      <div class="bar"><span class="name">CPU</span><div class="track"><div class="fill" id="bar-cpu" style="background:var(--cpu)"></div></div><span class="val" id="val-cpu">--</span></div>
      <div class="bar"><span class="name">NPU</span><div class="track"><div class="fill" id="bar-npu" style="background:var(--npu)"></div></div><span class="val" id="val-npu">--</span></div>
      <div class="verdict" id="verdict" hidden></div>
    </div>
    <div class="term">
      <div class="bar-top">root@imx93frdm (over SSH), live output</div>
      <pre id="term"></pre>
    </div>
  </aside>
</main>
<script>
const $ = (id) => document.getElementById(id);
const CHIP_LABELS = { os: "OS", kernel: "Kernel", npu: "NPU device", m33: "M33", vela: "Vela" };
const medianOf = (a) => { const s = [...a].sort((x, y) => x - y), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
const live = { cpu: [], npu: [] };
let src = null;

function addChip(key, value) {
  let el = document.querySelector(`[data-chip="${key}"]`);
  if (!el) { el = document.createElement("span"); el.className = "chip"; el.dataset.chip = key; $("chips").appendChild(el); }
  el.innerHTML = `${CHIP_LABELS[key] || key}: <b></b>`;
  el.querySelector("b").textContent = value;
}
function log(text, kind) {
  const t = $("term"), line = document.createElement("div");
  line.className = kind || ""; line.textContent = text; t.appendChild(line);
  t.scrollTop = t.scrollHeight;
}
function addCard(ev) {
  const card = document.createElement("div");
  card.className = "card new";
  const img = document.createElement("img");
  img.src = ev.url; img.alt = ev.label; img.loading = "eager";
  const cap = document.createElement("div"); cap.className = "cap";
  const l = document.createElement("span"); l.className = "l"; l.textContent = ev.label; l.title = ev.label;
  const t = document.createElement("span"); t.className = "t"; t.textContent = ev.ms.toFixed(2) + " ms";
  cap.append(l, t); card.append(img, cap);
  const grid = $("grid-" + ev.device);
  grid.appendChild(card); grid.scrollTop = grid.scrollHeight;
  setTimeout(() => card.classList.remove("new"), 600);
}
function updateBars() {
  const c = live.cpu.length ? medianOf(live.cpu) : null, n = live.npu.length ? medianOf(live.npu) : null;
  const max = Math.max(c || 0, n || 0) || 1;
  if (c) { $("bar-cpu").style.width = (100 * c / max) + "%"; $("val-cpu").textContent = c.toFixed(2) + " ms"; }
  if (n) { $("bar-npu").style.width = (100 * n / max) + "%"; $("val-npu").textContent = n.toFixed(2) + " ms"; }
}
function reset() {
  live.cpu = []; live.npu = [];
  for (const d of ["cpu", "npu"]) { $("grid-" + d).textContent = ""; $("ms-" + d).textContent = "--"; $("count-" + d).textContent = "waiting"; $("bar-" + d).style.width = 0; $("val-" + d).textContent = "--"; $("lane-" + d).classList.remove("active"); }
  $("term").textContent = ""; $("verdict").hidden = true; $("chips").textContent = "";
}
function handle(ev) {
  switch (ev.type) {
    case "chip": addChip(ev.key, ev.value); break;
    case "log": log(ev.text, ev.kind); break;
    case "stage":
      $("status").textContent = ev.title;
      log("== " + ev.title + " ==", "cmd");
      for (const d of ["cpu", "npu"]) $("lane-" + d).classList.toggle("active", ev.id === d);
      break;
    case "result":
      live[ev.device].push(ev.ms); addCard(ev);
      $("ms-" + ev.device).textContent = ev.ms.toFixed(2);
      $("count-" + ev.device).textContent = `image ${ev.n} of ${ev.of}`;
      updateBars(); break;
    case "summary": {
      const v = $("verdict"); v.hidden = false;
      v.innerHTML = `NPU ${ev.speedup.toFixed(1)}x faster<small>medians of this run, CPU ${ev.cpu_ms.toFixed(2)} ms vs NPU ${ev.npu_ms.toFixed(2)} ms. CPU and NPU agree on the top-1 label for ${ev.agree} of ${ev.total} images.</small>`;
      break; }
    case "error": log("ERROR: " + ev.text, "err"); $("status").textContent = "failed"; break;
    case "done":
      src.close(); $("start").disabled = false; $("start").textContent = "Run again";
      for (const d of ["cpu", "npu"]) $("lane-" + d).classList.remove("active");
      if ($("status").textContent !== "failed") $("status").textContent = "finished";
      break;
  }
}
async function startRun(count, files) {
  reset(); $("start").disabled = true; $("status").textContent = files ? "uploading" : "connecting";
  if (files) await stageUpload(files); else { $("tray").textContent = ""; $("upstat").textContent = ""; }
  $("status").textContent = "connecting";
  const params = new URLSearchParams(location.search);
  src = new EventSource(`/api/run?count=${count}&pace=${params.get("pace") || "0.6"}${files ? "&source=uploads" : ""}`);
  src.onmessage = (m) => handle(JSON.parse(m.data));
  src.onerror = () => { src.close(); $("start").disabled = false; if ($("status").textContent !== "finished") $("status").textContent = "connection lost"; };
}
$("start").addEventListener("click", () => startRun(Number(new URLSearchParams(location.search).get("count")) || 10, null));

/* Drag and drop: files are uploaded to the local server (real progress), the server sends them to the
   board over SSH, and the board classifies exactly those files. */
const MAX_IMAGES = 50, IMAGE_RE = /\.(jpe?g|png)$/i;
const fmtKB = (b) => (b / 1024).toFixed(0) + " KB";
function uploadOne(file, onProgress) {
  return new Promise((resolve, reject) => {
    const x = new XMLHttpRequest();
    x.open("POST", "/api/upload?name=" + encodeURIComponent(file.name));
    x.upload.onprogress = (e) => e.lengthComputable && onProgress(e.loaded / e.total);
    x.onload = () => (x.status === 200 ? resolve() : reject(new Error(x.responseText || x.statusText)));
    x.onerror = () => reject(new Error("upload failed"));
    x.send(file);
  });
}
async function stageUpload(files) {
  const tray = $("tray"), stat = $("upstat");
  tray.textContent = "";
  await fetch("/api/reset", { method: "POST" });
  const items = files.map((f) => {
    const el = document.createElement("div"); el.className = "up";
    el.innerHTML = '<div class="th"><img alt=""><div class="pg"></div></div><div class="nm"></div>';
    el.querySelector("img").src = URL.createObjectURL(f);
    el.querySelector(".nm").textContent = f.name; el.querySelector(".nm").title = f.name;
    tray.appendChild(el); return el;
  });
  for (let i = 0; i < files.length; i++) {
    stat.textContent = `Uploading ${i + 1} of ${files.length}: ${files[i].name} (${fmtKB(files[i].size)})`;
    const pg = items[i].querySelector(".pg");
    await uploadOne(files[i], (p) => { pg.style.width = (100 * p) + "%"; });
    items[i].classList.add("ok");
  }
  stat.textContent = `${files.length} image(s) received. Sending them to the board over SSH...`;
}
async function handleFiles(list) {
  const files = [...list].filter((f) => IMAGE_RE.test(f.name)).slice(0, MAX_IMAGES);
  if (!files.length || $("start").disabled) return;
  await startRun(files.length, files);
}
const drop = $("drop");
for (const t of ["dragenter", "dragover"]) drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.add("over"); });
for (const t of ["dragleave", "drop"]) drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.remove("over"); });
drop.addEventListener("drop", (e) => handleFiles(e.dataTransfer.files));
$("picker").addEventListener("change", (e) => { handleFiles(e.target.files); e.target.value = ""; });
window.addEventListener("dragover", (e) => e.preventDefault());
window.addEventListener("drop", (e) => e.preventDefault());
</script>
</body>
</html>
